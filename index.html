<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>J6 Assistant</title>
    <link rel="stylesheet" href="styles.css?v=20260621-1900">
  </head>
  <body>
    <main class="app">
      <section class="controls" aria-label="Chord set controls">
        <label class="field">
          <select id="setSelect"></select>
        </label>
        <label class="volume-control" aria-label="Volume">
          <input id="volumeSlider" type="range" min="0" max="100" value="75">
        </label>
      </section>

      <section class="chord-list" id="chordList" aria-live="polite"></section>
    </main>
    <script src="script.js?v=20260621-1900"></script>
  </body>
</html>
